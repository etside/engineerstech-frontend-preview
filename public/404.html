<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <script>
      // For GitHub Pages SPA routing with a subdirectory base path:
      // Redirect all 404s back to the index page so React Router can handle the route.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/'
      );
    </script>
  </head>
  <body></body>
</html>
