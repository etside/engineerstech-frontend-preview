<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Software Development Company in Bangladesh | engineersTech</title>
    <!-- meta description / canonical are injected per-route by <SEO> (src/components/SEO.tsx) via react-helmet-async -->
    <meta name="keywords" content="best software company in Bangladesh, top software company in Bangladesh, top 10 software companies Bangladesh, custom software development, ERP development, web application development, AI integration, mobile app development, IT company Dhaka, software development company for international clients, offshore software development Bangladesh, outsource software development, custom software solutions worldwide, enterprise SaaS development company, hire software development company">
    <meta name="author" content="engineersTech" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Fonts: preconnect + non-blocking load (swapped in via onload, falls back to system font until ready) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- Open Graph / Twitter defaults — overridden per-page by <SEO> (src/components/SEO.tsx) at runtime -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://engineerstechbd.com/og-default.jpg">
    <meta property="og:site_name" content="engineersTech" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@engineerstechbd" />

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "engineersTech",
      "alternateName": "engineersTechBD",
      "url": "https://engineerstechbd.com",
      "logo": "https://engineerstechbd.com/favicon.svg",
      "description": "engineersTech is a leading software development company in Bangladesh, ranked among the top 10 software companies for enterprise SaaS, ERP, CRM, AI, and web/mobile app development.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Rashi International, Level 6, Flat B6, Plot 9, Road 4, Sector 16/A",
        "addressLocality": "Uttara, Dhaka",
        "postalCode": "1230",
        "addressCountry": "BD"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+880-1314-443311",
        "contactType": "customer service",
        "email": "info@engineerstechbd.com"
      },
      "areaServed": "Worldwide",
      "sameAs": [
        "https://facebook.com/engineerstech",
        "https://linkedin.com/company/engineerstech",
        "https://twitter.com/engineerstech",
        "https://youtube.com/@engineerstech"
      ]
    }
    </script>

    <!-- Geo Tags -->
    <meta name="geo.region" content="BD-13" />
    <meta name="geo.placename" content="Dhaka" />
    <meta name="geo.position" content="23.8103;90.4125" />
    <meta name="ICBM" content="23.8103, 90.4125" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6KB097E6XR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6KB097E6XR');
    </script>
  </head>

  <body class="bg-[#0a0b0d] text-white">
    <script>
      // GitHub Pages SPA routing: restore real path from query string before React loads
      (function(l){
        if (l.search && l.search.startsWith('?/')) {
          var path = l.search.slice(2).replace(/~and~/g, '&');
          if (l.hash) path += l.hash;
          l.replace(l.pathname.replace(/\/$/, '') + '/' + path);
        }
      })(window.location);
    </script>
    <div id="root">
      <!-- Loading fallback for slow connections -->
      <div id="initial-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0b0d;">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 3px solid #1f2937; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
        </div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
