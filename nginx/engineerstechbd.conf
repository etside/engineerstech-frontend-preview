# engineerstechbd.com — main site nginx config
# Deploy: copy to /etc/nginx/sites-available/engineerstechbd.com
# then: ln -sf /etc/nginx/sites-available/engineerstechbd.com /etc/nginx/sites-enabled/
# and:  systemctl reload nginx

server {
    listen 80;
    server_name engineerstechbd.com www.engineerstechbd.com;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name engineerstechbd.com www.engineerstechbd.com;

    # SSL — managed by Certbot (update paths if different)
    ssl_certificate     /etc/letsencrypt/live/engineerstechbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engineerstechbd.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── MCP Streamable HTTP endpoint → Node.js on :3101 ─────────
    location = /mcp {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         300s;
        proxy_connect_timeout      10s;
        proxy_send_timeout         300s;
        chunked_transfer_encoding  on;
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-API-Key, Mcp-Session-Id' always;
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
    }

    # MCP health (no auth)
    location = /mcp/health {
        proxy_pass         http://127.0.0.1:3101/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # OAuth discovery → MCP Node.js
    location = /.well-known/oauth-authorization-server {
        proxy_pass         http://127.0.0.1:3101/.well-known/oauth-authorization-server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass         http://127.0.0.1:3101/.well-known/oauth-protected-resource;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # ChatGPT plugin files → served from Laravel public
    location ~ ^/\.well-known/(ai-plugin\.json|openapi\.json)$ {
        root  /var/www/engineerstech/eTwebsitebackend/public;
        try_files $uri =404;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Content-Type' 'application/json' always;
    }

    # ── Laravel API → PHP-FPM ────────────────────────────────────
    location ^~ /api/ {
        root  /var/www/engineerstech/eTwebsitebackend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    # Laravel storage (uploaded files)
    location ^~ /storage/ {
        root  /var/www/engineerstech/eTwebsitebackend/public;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Laravel sanctum csrf-cookie
    location = /sanctum/csrf-cookie {
        root  /var/www/engineerstech/eTwebsitebackend/public;
        try_files $uri $uri/ /index.php?$query_string;
        location ~ \.php$ {
            fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    # ── React SPA (frontend dist) ────────────────────────────────
    root  /var/www/engineerstech/etwebsite-frontend-src/dist;
    index index.html;

    # Static assets — long cache
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML — no cache (SPA shell updates on every deploy)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA catch-all — everything else → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
