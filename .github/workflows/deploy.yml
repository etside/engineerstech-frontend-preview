name: Build & Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 -H 103.132.96.251 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS via rsync
        run: |
          rsync -avz --delete \
            --exclude='storage' \
            --exclude='index.php' \
            --exclude='cron_publisher_engineerstechbd.php' \
            --exclude='.well-known' \
            --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./dist/ \
            root@103.132.96.251:/www/wwwroot/engineerstech/engineerstechbd.com/

      - name: Fix ownership on VPS
        run: |
          ssh -i ~/.ssh/deploy_key root@103.132.96.251 \
            "chown -R www-data:www-data /www/wwwroot/engineerstech/engineerstechbd.com/"
